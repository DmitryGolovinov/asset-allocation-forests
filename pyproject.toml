[project]
name = "asset-allocation-forests"
version = "0.1.0"
description = "Asset allocation forests: estimation error, stability, and turnover"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=2.0", "pandas>=2.2", "scipy>=1.13", "scikit-learn>=1.5", "cvxpy>=1.5",
  "clarabel>=0.9", "pyarrow>=16", "pyyaml>=6", "tabulate>=0.9", "matplotlib>=3.8", "openpyxl>=3.1", "requests>=2.31", "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
[tool.ruff.lint.per-file-ignores]
"scripts/leaf_benchmark.py" = ["E501"]   # markdown table headers
